  #     - ADMIN_TOKEN=${ADMIN_TOKEN}
  #     - IONOS_SMTP_PASS=${IONOS_SMTP_PASS}
  #     - IONOS_IMAP_PASS=${IONOS_IMAP_PASS}
  #   volumes:
