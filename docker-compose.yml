services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dj-except4-web
    ports:
      - "18082:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - api

  api:
    build:
      context: ./api-server
      dockerfile: Dockerfile
    container_name: dj-except4-api
    ports:
      - "3001:3001"
    volumes:
      - ./api-server/uploads:/app/uploads
      - ./api-server/data:/app/data
      - ./api-server/.env:/app/.env:ro
    environment:
      - API_PORT=3001
      - SMTP_HOST=smtp.ionos.de
      - SMTP_PORT=587
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - CONTACT_EMAIL=${CONTACT_EMAIL:-info@djexcept4.de}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health',r=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>{console.log(d);process.exit(d.includes('ok')?0:1)})})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s